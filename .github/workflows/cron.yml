name: Check Trackings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets exist
        run: |
          if [ -z "$APP_URL" ]; then
            echo "❌ APP_URL is EMPTY"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET is EMPTY"
            exit 1
          fi
          echo "✅ APP_URL length: ${#APP_URL}"
          echo "✅ CRON_SECRET length: ${#CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Test DNS resolve
        run: |
          # Extract hostname từ URL
          HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1)
          echo "Hostname to resolve: $HOSTNAME"
          nslookup "$HOSTNAME" || echo "DNS lookup failed"
          curl -v --max-time 10 "$APP_URL" 2>&1 | head -30
        env:
          APP_URL: ${{ secrets.APP_URL }}

      - name: Call cron endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "${APP_URL}/api/cron/check-trackings" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 55)
          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Expected 200 but got $RESPONSE"
            exit 1
          fi
          echo "✅ Cron completed successfully"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
