name: Check Trackings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Debug URL
        run: |
          echo "Length: ${#APP_URL}"
          # In hex để phát hiện ký tự ẩn
          echo -n "$APP_URL" | xxd | head -5
          # Test curl thẳng với URL cứng để loại trừ vấn đề secret
          echo "---"
          echo "Testing with hardcoded URL..."
          curl -s -o /dev/null -w "Hardcoded test: %{http_code}\n" \
            "https://tracking-shopee.vercel.app/api/cron/check-trackings" \
            --max-time 10 || echo "Hardcoded curl exit: $?"
          echo "---"
          echo "Testing with secret URL..."
          curl -s -o /dev/null -w "Secret test: %{http_code}\n" \
            "${APP_URL}/api/cron/check-trackings" \
            --max-time 10 || echo "Secret curl exit: $?"
        env:
          APP_URL: ${{ secrets.APP_URL }}

      - name: Call cron endpoint
        run: |
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X GET "${APP_URL}/api/cron/check-trackings" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 55)
          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Expected 200 but got $RESPONSE"
            exit 1
          fi
          echo "✅ Cron completed successfully"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
